name: Bot worker

# Calls the deployed app's bot-run worker route - the actual work (claiming
# selecting runs, entering a candidate, monitoring holding runs for a
# stop-loss/day-expiry/rule-exit) all lives behind that one HTTP endpoint
# (app/api/worker/bot-runs/route.ts), not in this workflow. Mirrors
# limit-order-worker.yml's exact shape (bearer secret, WORKER_URL, the
# route's own VERCEL_ENV production guard, and the schedule itself - see
# below).
#
# Uses the SAME repo secret as the limit-order worker, not a second one -
# app/api/worker/bot-runs/route.ts calls the exact same
# isAuthorizedWorkerRequest (lib/auth/worker-secret.ts), which checks
# process.env.LIMIT_ORDER_WORKER_SECRET specifically. There is no separate
# BOT_WORKER_SECRET anywhere in the app; inventing one here would just
# reference a value the route never checks.
#
# A real manual workflow_dispatch run was verified first (200, 3 runs
# correctly evaluated across the full 517-symbol watchlist, zero false
# entries, consistent zero counts across every dependent field) before this
# schedule was added - see STATE.md.
on:
  schedule:
    # Every 5 minutes, unconditionally - deliberately NOT restricted to
    # market hours, matching limit-order-worker.yml's own schedule exactly
    # rather than inventing a new pattern. This is a real choice, not an
    # oversight: a hardcoded UTC market-hours window would need manual
    # adjustment across the EST/EDT boundary twice a year - exactly the
    # class of bug lib/trading/market-hours.ts's own real IANA-timezone
    # handling was built to avoid, so hand-rolling a second, cruder version
    # of the same problem here would be a step backward, not forward.
    # Market-hours awareness lives in the route itself, not the schedule:
    # runSelectionCycle/runMonitoringCycle (lib/db/bot-runs.ts) each start
    # with a cheap DB SELECT and return immediately - no Alpaca call at all
    # - whenever there are no selecting/holding runs, so a tick outside
    # market hours (or with nothing active) costs almost nothing, the same
    # tolerance-for-irregular-invocation the limit-order worker's own
    # schedule already relies on.
    - cron: "*/5 * * * *"
  # Lets this be triggered by hand from the Actions tab too - useful for a
  # spot-check without waiting for the next tick, not just for testing
  # before the schedule existed.
  workflow_dispatch: {}

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - name: Call the worker route
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          LIMIT_ORDER_WORKER_SECRET: ${{ secrets.LIMIT_ORDER_WORKER_SECRET }}
        run: |
          if [ -z "$WORKER_URL" ] || [ -z "$LIMIT_ORDER_WORKER_SECRET" ]; then
            echo "Missing the WORKER_URL or LIMIT_ORDER_WORKER_SECRET repository secret - see README.md's Setup section." >&2
            exit 1
          fi

          status=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "$WORKER_URL/api/worker/bot-runs" \
            -H "Authorization: Bearer $LIMIT_ORDER_WORKER_SECRET")

          echo "HTTP status: $status"
          cat /tmp/response.json
          echo

          if [ "$status" -ge 400 ]; then
            echo "Worker call failed." >&2
            exit 1
          fi
